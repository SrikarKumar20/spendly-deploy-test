<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spendly</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>💸 Spendly</h1>

      <!-- Add-expense form -->
      <form id="expense-form" class="card">
        <div class="field">
          <label for="title">Title</label>
          <input id="title" type="text" placeholder="e.g. Groceries" />
        </div>

        <div class="field">
          <label for="amount">Amount</label>
          <input id="amount" type="number" step="0.01" placeholder="e.g. 250" />
        </div>

        <div class="field">
          <label for="category">Category</label>
          <!-- TODO (optional): you may fill these <option>s from the Category enum in app.ts -->
          <select id="category">
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Bills">Bills</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <button type="submit">Add Expense</button>
        <p id="error" class="error" role="alert"></p>
      </form>

      <!-- Expense list -->
      <section class="card">
        <h2>Expenses</h2>
        <ul id="list" class="list"></ul>
      </section>

      <!-- Totals -->
      <section class="card">
        <h2>Summary</h2>
        <p id="total" class="total"></p>
        <ul id="breakdown" class="breakdown"></ul>
      </section>
    </main>

    <!-- Loads the COMPILED JavaScript, not the .ts file -->
    <script type="module" src="dist/app.js"></script>
  </body>
</html>
